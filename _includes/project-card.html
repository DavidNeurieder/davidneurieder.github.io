<div class="home-project-card">
  <h3 class="home-project-name">
    <a href="{{ project.repo }}" rel="noopener">{{ project.name }}</a>
  </h3>
  <p class="home-project-blurb">{{ project.blurb }}</p>
  {% if project.posts %}
  <p class="home-project-links">
    {% for slug in project.posts %}
      {% assign post = site.posts | where_exp: "p", "p.slug == slug" | first %}
      {% if post %}
      <a class="home-project-post" href="{{ post.url | relative_url }}">
        {{ post.title | truncatewords: 8 }}
      </a>
      {% endif %}
    {% endfor %}
  </p>
  {% endif %}
</div>
