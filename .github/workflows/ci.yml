name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (Jekyll)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec jekyll build --trace

  audit:
    name: Security (bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: gem install bundler-audit
      # GHSA-47m2-wp7j-p9vc (rubyzip path traversal) is ignored because the
      # github-pages gem pins rubyzip at 2.4.1 and the fix needs >= 3.4.0.
      # Revisit after github-pages releases.
      - run: bundle-audit check --update --ignore GHSA-47m2-wp7j-p9vc